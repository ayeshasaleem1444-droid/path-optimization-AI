<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Path Optimizer AI | Smarter Routes</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="logo-area">
          <h2>Path Optimizer AI</h2>
          <p>Smarter routes. Better outcomes.</p>
        </div>

        <div
          class="routing-search-panel"
          style="
            background: #1e293b;
            border-radius: 16px;
            padding: 16px;
            margin: 15px 0;
            border: 1px solid #334155;
          "
        >
          <h3 style="font-size: 1rem; color: white; margin-bottom: 12px">
            🔍 Route Planner
          </h3>

          <div
            class="input-field"
            style="
              margin-bottom: 10px;
              display: flex;
              flex-direction: column;
              gap: 4px;
            "
          >
            <label
              style="
                font-size: 0.75rem;
                color: #94a3b8;
                font-weight: 600;
                text-transform: uppercase;
              "
              >Starting Point</label
            >
            <input
              type="text"
              id="startLocationSelect"
              placeholder="e.g. Packages Mall, Lahore"
              style="
                background: #0f172a;
                border: 1px solid #334155;
                color: white;
                padding: 8px 10px;
                border-radius: 8px;
                width: 100%;
              "
            />
          </div>

          <div
            class="input-field"
            style="
              margin-bottom: 10px;
              display: flex;
              flex-direction: column;
              gap: 4px;
            "
          >
            <label
              style="
                font-size: 0.75rem;
                color: #94a3b8;
                font-weight: 600;
                text-transform: uppercase;
              "
              >Destination Target</label
            >
            <input
              type="text"
              id="endLocationSelect"
              placeholder="e.g. MAO College, Lahore "
              style="
                background: #0f172a;
                border: 1px solid #334155;
                color: white;
                padding: 8px 10px;
                border-radius: 8px;
                width: 100%;
              "
            />
          </div>

          <button
            id="findPathButton"
            style="
              background: #3b82f6;
              color: white;
              border: none;
              width: 100%;
              padding: 10px;
              border-radius: 8px;
              font-weight: 600;
              cursor: pointer;
              transition: background 0.2s;
            "
          >
            ⚡ Run AI Optimization
          </button>
        </div>
      </aside>

      <main class="main-content">
        <div id="dashboard-panel" class="view-panel active-view">
          <div
            class="map-card"
            style="
              margin-bottom: 24px;
              background: white;
              padding: 15px;
              border-radius: 16px;
              box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            "
          >
            <div
              id="map"
              style="
                width: 100%;
                height: 420px;
                border-radius: 12px;
                background-color: #f1f5f9;
              "
            ></div>
          </div>

          <div class="summary-cards">
            <div class="card">
              <div class="card-title">Total Distance</div>
              <div class="card-value" id="totalDistance">
                -- <span>km</span>
              </div>
            </div>
            <div class="card">
              <div class="card-title">Total Time</div>
              <div class="card-value" id="totalTime">--</div>
            </div>
            <div class="card">
              <div class="card-title">Fuel Saved</div>
              <div class="card-value" id="fuelSaved">-- <span>L</span></div>
            </div>
            <div class="card">
              <div class="card-title">Stops</div>
              <div class="card-value" id="stopsCount">--</div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
  </body>
</html>
